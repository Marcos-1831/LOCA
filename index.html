<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Universo Contigo 🌙</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo de estrellas -->
    <div class="stars"></div>
    <div class="shooting-stars"></div>

    <!-- Luna -->
    <div class="moon">
        <div class="moon-glow"></div>
    </div>


    <!-- Contenido principal -->
    <main class="container">

        <h1 class="title">
            Nuestro pequeño universo 🌌
        </h1>

        <p class="subtitle">
            Una historia escrita entre estrellas ✨
        </p>


        <!-- Sobre -->
        <section class="envelope-container">

            <div class="envelope" id="envelope">

                <div class="flap"></div>

                <div class="letter">

                    <h2>Para alguien especial 💌</h2>

                    <p id="typing-text"></p>

                </div>

            </div>

        </section>


        <!-- Botón -->
        <button id="openButton">
            Abrir carta ✨
        </button>


        <!-- Música -->
        <audio id="music" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>

        <button id="musicButton">
            🎵 Música
        </button>


        <!-- Mensaje final -->
        <div class="final-message">

            <h2>
                Aunque el universo sea enorme...
            </h2>

            <p>
                Hay personas que hacen que un pequeño momento
                se sienta como una galaxia completa. 🌙✨
            </p>

        </div>


    </main>


    <script src="script.js"></script>

</body>
</html>
