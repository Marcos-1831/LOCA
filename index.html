<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Universo Contigo 🌙</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo de estrellas -->
    <div class="stars"></div>
    <div class="shooting-stars"></div>

    <!-- Luna -->
    <div class="moon">
        <div class="moon-glow"></div>
    </div>


    <!-- Contenido principal -->
    <main class="container">

        <h1 class="title">
            Nuestro pequeño universo 🌌
        </h1>

        <p class="subtitle">
            Una historia escrita entre estrellas ✨
        </p>


        <!-- Sobre -->
        <section class="envelope-container">

            <div class="envelope" id="envelope">

                <div class="flap"></div>

                <div class="letter">

                    <h2>Para alguien especial 💌</h2>

                    <p id="typing-text"></p>

                </div>

            </div>

        </section>


        <!-- Botón -->
        <button id="openButton">
            Abrir carta ✨
        </button>


        <!-- Música -->
       <div class="music-player">

    <img src="cover.jpg" class="cover">

    <div class="song-info">
        <h3>Mi Universo</h3>
        <p>Una canción especial 🌙</p>
    </div>


    <audio id="music">
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <div class="controls">

        <button id="prev">
            ⏮
        </button>


        <button id="play">
            ▶️
        </button>


        <button id="next">
            ⏭
        </button>

    </div>


    <input 
    type="range" 
    id="progress"
    value="0">


    <input 
    type="range" 
    id="volume"
    min="0"
    max="1"
    step="0.01"
    value="0.7">


</div>


        <!-- Mensaje final -->
        <div class="final-message">

            <h2>
                Aunque el universo sea enorme...
            </h2>

            <p>
                Hay personas que hacen que un pequeño momento
                se sienta como una galaxia completa. 🌙✨
            </p>

        </div>


    </main>


    <script src="script.js"></script>

</body>
</html>
